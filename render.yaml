# Render.com deployment configuration
# Deploy at: https://render.com → New Web Service → Connect your GitHub repo
#
# One-click deploy button:
# [![Deploy to Render](https://render.com/images/deploy-to-render-button.svg)](https://render.com/deploy)

services:
  - type: web
    name: coding-agent-harness
    env: docker
    repo: https://github.com/njuer-bin/ai-coding-harness
    branch: main
    dockerfilePath: ./untitled/Dockerfile
    dockerContext: ./untitled
    envVars:
      - key: JAVA_OPTS
        value: -Xmx256m
    healthCheckPath: /
    ports:
      - port: 8080
    startCommand: java -jar /app/coding-agent.jar --server --port=8080